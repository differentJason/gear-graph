# Source of truth for what a MIDI CONTROLLER is set up to send, and to whom: program changes and pedal/knob CCs.
# Same discipline as midi_channels.yaml: nothing the owner has not stated or accepted is `confirmed`, unknown stays unknown.
# The page section is generated by tools/midi_reference.py ("Foot controller" on the MIDI channels page) and checked by
# tools/validate_midi.py (targets exist, channels match the targets' recorded channels, CC numbers appear in the cited
# manual section when the manuals are present locally).
#
# maps:
#   - id, setup, device (inventory id), firmware (what is actually running; replacement chips change everything)
#     status: confirmed | unconfirmed (a proposal; excluded from conclusions)
#     program_change: {channel, targets: [device ids], ...}   # what selects patterns/presets on the targets
#     pedals: [{pedal, channel, cc, target, parameter, source: <manual-id>/<section-file-stem>}]
#     not_targets: [{device, reason}]                          # asked about, deliberately left out, and why

schema_version: 1
updated: 2026-10-10

maps:
  - id: fcb1010-pattern-switching
    setup: main-studio
    device: behringer-fcb1010
    firmware: "EurekaPROM (replacement EPROM), PP = Programmable configuration"
    status: confirmed
    confirmed: 2026-10-10
    note: >-
      Proposed by the assistant 2026-10-10 and accepted by the owner the same day ("confirm the proposals"), after the owner asked for pattern switching on the RD-9, Digitakt and/or
      Analog Four and usable expression-pedal targets, and chose the wiring RD-9 -> FCB1010 (merge) -> Digitakt.
      Programming steps come from the EurekaPROM PP and Setup web pages (eurekasound.com/eurekaprom/pp, /setup), not
      from the ingested Behringer manual, whose programming chapters describe the stock firmware.
    program_change:
      channel: 15
      targets: [elektron-digitakt-mk1, elektron-analog-four]
      mode: "Pr (Presets): pedals 1/6 = channel (set 15C), 2/7 = bank (set b- = no bank CC sent first), pedal 10 on = a program change goes out on every preset change; FP (Favorite Presets) holds 10 one-stomp presets"
      offset: 0
      numbering: >-
        Elektron convention: program 0-127 = patterns A01-H16 (program n = bank 'ABCDEFGH'[n // 16], pattern n % 16 + 1;
        0 = A01, 16 = B01, 127 = H16). The ingested Digitakt and Analog Four manuals say patterns 'can be changed and
        queued by sending program change messages' but do not print this table: check one pattern on the unit first.
      behaviour: "A program change queues the new pattern; it starts when the playing pattern ends (same as choosing it on the panel)."
      and_or: >-
        One channel = lockstep: both boxes take the same pattern number. To switch only one, turn PRG CH RECEIVE off on
        the other (MIDI CONFIG > SYNC). Alternative layout if independent switching is used more than lockstep: set each
        box's PROGRAM CHG IN CH to AUTO (Digitakt 14, A4 13) and flip the FCB's channel live with pedals 1/6.
    pedals:
      - {pedal: Ea, channel: 14, cc: 74, target: elektron-digitakt-mk1, parameter: "Filter Frequency (active track, via AUTO CHANNEL)",
         source: elektron-digitakt-mk1-manual/114-b-4-filter-parameters}
      - {pedal: Eb, channel: 13, cc: 18, target: elektron-analog-four, parameter: "Filter1 Frequency (active track, via AUTO CHANNEL)",
         source: elektron-analog-four-mkii-manual/104-appendix-d-midi}
    alternatives:
      # Other single-CC targets on the same channels, all from the manuals' CC tables. Swap one in by changing Ea/Eb's CC.
      - {channel: 14, cc: 95, target: elektron-digitakt-mk1, parameter: "Track Level (active track)", source: elektron-digitakt-mk1-manual/111-b-1-track-parameters}
      - {channel: 14, cc: 82, target: elektron-digitakt-mk1, parameter: "Delay Send (active track)", source: elektron-digitakt-mk1-manual/115-b-5-amp-parameters}
      - {channel: 14, cc: 83, target: elektron-digitakt-mk1, parameter: "Reverb Send (active track)", source: elektron-digitakt-mk1-manual/115-b-5-amp-parameters}
      - {channel: 14, cc: 75, target: elektron-digitakt-mk1, parameter: "Resonance (active track)", source: elektron-digitakt-mk1-manual/114-b-4-filter-parameters}
      - {channel: 13, cc: 89, target: elektron-analog-four, parameter: "Filter1 Resonance (active track)", source: elektron-analog-four-mkii-manual/104-appendix-d-midi}
      - {channel: 13, cc: 92, target: elektron-analog-four, parameter: "Delay Send Level (active track)", source: elektron-analog-four-mkii-manual/104-appendix-d-midi}
      - {channel: 13, cc: 95, target: elektron-analog-four, parameter: "Track Level (active track)", source: elektron-analog-four-mkii-manual/104-appendix-d-midi}
    not_targets:
      - {device: behringer-rd-9, reason: "Its ingested manual (V 1.0) documents no program-change pattern select, and in this wiring the RD-9 is upstream of the FCB1010, so it receives nothing from it. Revisit if a firmware note says otherwise."}
      - {device: emu-proteus-mps, reason: "It sits on a Thru5 output, which carries only the Digitakt's own MIDI OUT, so the FCB's pedals never reach it. Its four realtime controllers (Master > MIDI Controller Assign) could take a pedal only on a cable that does."}
    open_checks:
      - "MIDI thru/merge in the PP configuration: the EurekaPROM FAQ says it is supported but the PP page shows no on/off step. With the FCB inline, confirm the Digitakt and A4 still follow the RD-9's clock and transport."
      - "Calibrate Ea/Eb once (hold pedals 1 + 5 at power-up, display 'CA'); the pedals' value range is not documented for PP."
