name: Deploy site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install mkdocs mkdocs-material pyyaml
      - name: Generate the public site sources
        run: python tools/build_public.py
      - name: Build (strict: any broken link fails)
        run: mkdocs build --strict -f public/mkdocs.yml
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public/site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
