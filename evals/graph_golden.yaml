# Questions asked of the knowledge graph, with the answer worked out BY HAND from connections.yaml.
# tools/query_graph.py runs each one and fails if the graph disagrees. Like evals/golden.jsonl, but for the graph.
# Questions marked `cross` in the runner have no hand-written answer: an independent implementation reads the raw files instead.
questions:
  - id: q1
    question: "What does the RD-9 feed directly, and by which medium?"
    query: feeds
    item: behringer-rd-9
    expected: {audio: [behringer-umc1820], clock: [arturia-keystep, jakes-clock-and-musical-divider, korg-sq-64], midi: [elektron-digitakt-mk1]}
    basis: "connections.yaml (2026-09-23): MONO -> UMC1820 input 1; SYNC OUT -> SQ-64, KeyStep, Jake's clock; MIDI OUT -> Digitakt MIDI IN (was -> MIDI Thru5 before the 2026-09-23 rewiring)."

  - id: q2
    question: "Which devices receive clock or MIDI from the RD-9, directly or through other devices?"
    query: reach
    item: behringer-rd-9
    media: [midi, clock]
    expected: {arturia-keystep: 1, jakes-clock-and-musical-divider: 1, korg-sq-64: 1, elektron-digitakt-mk1: 1, midi-thru5: 2, elektron-analog-four: 2, behringer-k2: 3, donner-b1: 3, dreadbox-typhon: 3, korg-m1: 3, behringer-umc1820: 3}
    basis: "connections.yaml (2026-09-23): RD-9 SYNC OUT -> SQ-64, KeyStep, Jake's clock and MIDI OUT -> Digitakt (1 hop); Digitakt OUT -> Thru5 and Digitakt THRU -> Analog Four (2 hops); Thru5 -> M1, Typhon, K2, B1, UMC1820 MIDI IN (3 hops)."

  - id: q3
    question: "What does the Digitakt feed?"
    query: feeds
    item: elektron-digitakt-mk1
    expected: {audio: [behringer-umc1820], midi: [elektron-analog-four, midi-thru5]}
    basis: "connections.yaml (2026-09-23): audio out -> interface inputs 7/8; MIDI OUT -> Thru5; MIDI THRU -> Analog Four."

  - id: q4
    question: "What does the Korg M1 feed?"
    query: feeds
    item: korg-m1
    expected: {}
    basis: "The M1 receives MIDI but where its audio goes is an open statement in connections.yaml. The graph must say 'nothing recorded', not 'nothing connected'."
    note: "An empty answer here means the wiring was not stated, not that the M1 is unplugged."

  - id: q5
    question: "How many spec values rest on a single source, and of what kind?"
    query: support
    note: "Checked against the raw evidence files, not against the graph itself."

  - id: q6
    question: "Which items have no recorded connection, by category?"
    query: unrecorded
    note: "Checked against connections.yaml, not against the graph itself. 'No recorded connection' is not 'not connected'."

  - id: q7
    question: "Do any devices fed MIDI through a shared fan-out share the same recorded IN channel?"
    query: midi_conflicts
    note: "Checked against connections.yaml + midi_channels.yaml, not against the graph itself. midi_channels.yaml
           starts empty, so today's honest answer is: no conflicts, and every device downstream of the MIDI Thru5
           fan-out has 'not recorded' for its channel -- not the same as 'no conflict'. This will become a
           meaningful check once the owner records real channel settings."

  - id: q8
    question: "Which concepts do different manufacturers name differently in their manuals?"
    query: naming
    show: [envelope, high-pass, control-change, waveform, audio-in]
    note: "Checked against graph/public/terms.json + the inventory, not against the graph itself. Each manufacturer's word for
           a concept is the label its manuals use most often. A maker whose manuals use two labels equally often is reported
           as a tie and decides nothing (Donner uses 'emphasis' and 'resonance' once each, so resonance is NOT reported).
           Trig and step are separate, close-matched concepts, so they are never compared here."

  - id: q9
    question: "Which devices' manuals describe the filter cutoff and something that can modulate it, including narrower kinds of modulator?"
    query: inherits
    param: cutoff
    note: "Ontology + taxonomy together: TERMS.yaml states 'LFO modulates cutoff' and 'envelope modulates cutoff'; ADSR inherits it
           because it is a narrower kind of envelope. Checked against TERMS.yaml + terms.json by separate code, not the graph."
