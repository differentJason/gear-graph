# Source of truth for the MIDI channel each device should be SET TO for live performance -- a device SETTING the
# owner wants recorded and recalled, never inferred from a manual. Same discipline as connections.yaml: nothing is
# recorded that the owner has not stated, everything carries a status and (once confirmed) a date, unknown stays
# unknown.
#
# ids refer to `id:` values in inventory.yaml. `setup` refers to `setups:` in connections.yaml -- the same studio
# arrangement the device's cables are recorded for. A device can want a different channel in a different setup.
#
# in:                channel the device should RECEIVE on. One of 1-16, "omni" (listens on every channel), or "off"
#                     (ignores incoming MIDI). Omit if the device has no MIDI IN, or the owner has not decided yet.
#                     Vocabulary is normalized to this project's own terms even where a device's own panel says
#                     something else (e.g. the RD-9 manual's "All"/"Out" become "omni" here), the same way
#                     connections.yaml normalizes port wiring into a fixed `medium` enum.
# out:               channel the device should TRANSMIT on. One of 1-16, or "off". Omit if no MIDI OUT / not decided.
# thru_pass_enabled: true/false. Whether the device forwards MIDI it receives back out (a soft-thru toggle, e.g. the
#                     Donner B1's MIDI SOFT THROUGH). Most gear's hardware MIDI THRU jack (if it has one) is a dumb,
#                     unfiltered passthrough with no channel or on/off concept, so this field is only meaningful for
#                     devices with an actual soft-thru setting -- omit it otherwise. See decisions.md D22 for why
#                     this project does not track a "thru channel": for this rack's gear, "thru" is not
#                     channel-based (a MIDI thru box re-sends every byte unchanged; the Analog Four's THRU PORT
#                     FUNCTIONALITY selects a sync format, not a channel).
# role:              free text naming which of the device's internal MIDI parameters this channel maps to, for any
#                     device with more than one MIDI-channel concept (e.g. Elektron's AUTO CHANNEL vs. its per-track
#                     channels). Required whenever that's the case, so a future reader knows exactly which menu item
#                     this is without re-deriving it from the manual.
# status/confirmed:  same meaning as connections.yaml. `unconfirmed` entries are excluded from conclusions
#                     (validate_midi.py and query_graph.py's midi_conflicts query both honor this).
#
# This file starts EMPTY on purpose: the assistant that built this schema does not know what channel the owner
# actually wants each device set to, and fabricating a "confirmed" answer would violate the rule above. Fill it in
# the same way connections.yaml was filled in -- one device at a time, stating only what is actually true.

schema_version: 1
updated: 2026-09-23

channels:
  # PERMANENT HOME CHANNELS (owner, 2026-09-23): every MIDI-capable instrument keeps one channel for good, whether or
  # not it is currently wired. Swapping gear changes the TRIGGER SOURCE's output channel (e.g. a Digitakt MIDI
  # track), never the instrument's own setting. Audio follows the slot: swapped-in gear takes the interface input of
  # what it replaced (connections.yaml open_statements). Channels were chosen by the assistant at the owner's request
  # and accepted by the owner ("I will set all as assigned"). Readable table: docs/midi-channels.md (generated).
  #
  #  1 K2 | 2 Typhon | 3 M1 | 4 B1 | 5-8 Timbre Wolf (voice 1-4) | 9 Liven | 10 RD-9 | 11 TR-505 | 12 spare (MC-303 is omni; see its entry)
  # 13 Analog Four | 14 Digitakt | 15 Rhythm Wolf (if settable) | 16 spare
  - {setup: main-studio, device: behringer-k2, in: 1, status: confirmed, confirmed: 2026-09-23,
     note: "Rear-panel MIDI channel switches. MIDI IN/THRU only, no MIDI OUT, so no out channel. Played by a Digitakt MIDI track set to 1."}
  - {setup: main-studio, device: donner-b1, in: 4, out: 4, status: confirmed, confirmed: 2026-09-23,
     note: "Hold STEP 4 at power-on (sets in and out together, per manual). Own channel, so swapping K2 -> B1 means pointing the Digitakt track at 4. Clock: hold D#2 at power-on for DIN, or leave Automatic."}
  - {setup: main-studio, device: dreadbox-typhon, in: 2, status: confirmed, confirmed: 2026-09-23,
     note: "Global Settings > MIDI CHANNELS > INPUT = 2 (never ALL). MASTER CLOCK = External. The manual's menu lists only an input channel."}
  - {setup: main-studio, device: korg-m1, in: 3, out: 3, status: confirmed, confirmed: 2026-09-23,
     note: "Set in GLOBAL mode, F5-1 (Global MIDI channel) -- verified in the OCR'd owner's manual 2026-09-23. In Combination/Multi use, each Timbre also has its own receive channel (Combination F2-1 MIDI CH); only Timbres on the Global channel sound from the M1's own keyboard."}
  - {setup: main-studio, device: akai-timbre-wolf, in: 5, out: 5, status: confirmed, confirmed: 2026-09-23, role: "MIDI Ch (Voice 1 channel)",
     note: "Per manual, voices 2-4 answer on the next three channels, so 5-8 are all reserved for it (voice 1 = 5). In Poly/Unison mode only 5 is used, but 6-8 stay reserved."}
  - {setup: main-studio, device: sonicware-liven-texture-lab, in: 9, out: 9, status: confirmed, confirmed: 2026-09-23,
     note: "RX.CH = 9 and TX.CH = 9 in the MIDI settings (manual: ALL / CH.01-16 / NONE)."}
  - {setup: main-studio, device: behringer-rd-9, in: 10, out: 10, thru_pass_enabled: false, status: confirmed, confirmed: 2026-09-23,
     note: "Owner: RD-9 sends on 10 and is the master clock (SYNC = INTERNAL). MIDI IN channel: 10 (or 'Out', which follows the out channel). SOFT THRU off -- per the manual it turns MIDI OUT into a second THRU."}
  - {setup: main-studio, device: roland-tr-505, in: 11, out: 11, status: confirmed, confirmed: 2026-09-23,
     note: "Verified in the OCR'd owner's manual 2026-09-23: in the MIDI function, set OMNI OFF (Down key) and the receive channel with Up/Down (1-16). The TRANSMIT channel is per drum voice (factory: 10 for every voice) -- set each voice to 11, otherwise it transmits on the RD-9's channel 10. Drum voice key numbers (25-99) are set there too."}
  - {setup: main-studio, device: roland-mc-303, in: omni, status: confirmed, confirmed: 2026-09-23, role: "normal mode: incoming notes go to the Part chosen with PART SELECT",
     note: "CORRECTION 2026-09-23 (from the OCR'd owner's manual): the MC-303 has no single settable MIDI channel, so the home channel 12 assigned earlier cannot be set. In normal mode it plays incoming MIDI on ANY channel into the Part selected with PART SELECT (effectively omni). In Sound Module mode each Part has a fixed receive channel (see MIDI Implementation). It TRANSMITS Parts 1-7 on channels 1-7 and the Rhythm Part on channel 10 (fixed). Practical rule: give it its own MIDI line, and don't merge its MIDI OUT into the RD-9/Digitakt chain. Channel 12 is free again. Accepted by the owner 2026-09-23."}
  - {setup: main-studio, device: elektron-analog-four, in: 13, out: 13, status: confirmed, confirmed: 2026-09-23, role: "MIDI CONFIG > CHANNELS > AUTO CHANNEL",
     note: "Fed from the Digitakt THRU (raw RD-9 stream). SYNC: CLOCK + TRANSPORT RECEIVE on, SEND off. No synth-track channel may be 10."}
  - {setup: main-studio, device: elektron-digitakt-mk1, in: 14, out: 14, status: confirmed, confirmed: 2026-09-23, role: "MIDI CONFIG > CHANNELS > AUTO CHANNEL",
     note: "Middle of the chain: CLOCK + TRANSPORT RECEIVE on AND SEND on. PORT CONFIG: INPUT FROM = MIDI, OUTPUT TO = MIDI, OUT PORT FUNCTIONALITY = MIDI. Audio track channels: none on 10 (OFF if unused). MIDI tracks send on the home channel of whatever they play (1 K2, 2 Typhon, 3 M1, 4 B1, ...)."}
  - {setup: main-studio, device: akai-rhythm-wolf, status: confirmed, confirmed: 2026-09-23,
     note: "Channel 15 reserved for it, but no in/out is recorded: the ingested user guide shows no MIDI channel setting (it points to Akai's MIDI implementation chart). If its drum channel turns out to be fixed at 10, it can share a line with the RD-9 only if the RD-9's notes are filtered out."}
