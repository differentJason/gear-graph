# Provenance manifest for images/ -- ORIGINAL illustrations, committed and published.
#
# Every image is drawn by tools/draw_devices.py from this repo's own facts (name, maker, category; Eurorack width in HP
# and 1U/3U format; case mounting order from connections.yaml). No product photo or maker panel is copied or traced;
# knobs/jacks/keys/pads are generic and illustrate the kind of device, not its real panel. The product photos this
# repo used to cache locally were deleted on 2026-09-23 (owner's decision) and replaced by these drawings.
#
# device:     the matching id in inventory.yaml
# file:       images/<id>.jpg (raster, what consumers load)   svg: images/<id>.svg (the vector source)
# photo_type: original (drawn by this repo)
# source:     the generator that drew it
# generated:  the date it was last drawn

