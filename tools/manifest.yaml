    model: Analog Four MKII
    title: Analog Four MKII User Manual
    doc_type: user-manual
    doc_version: OS 1.55
    language: en
    pdf: sources/analog-four-mkii_OS1.55.pdf
    source_url: https://www.elektron.se/wp-content/uploads/2026/06/Analog-Four-MKII-User-Manual_ENG_OS1.55_260610.pdf
    retrieved: 2026-09-20
    pages: [10, 113]
    split: outline
    split_level: 2
    applies_to: "Analog Four MKII (owner confirmed MKII on 2026-09-20)."

