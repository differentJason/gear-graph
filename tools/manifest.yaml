  - id: behringer-umc404hd-quick-start
    device: behringer-umc404hd
    manufacturer: Behringer
    model: U-PHORIA UMC404HD
    title: U-PHORIA Quick Start Guide (UMC404HD family)
    doc_type: quick-start
    doc_version: "QSG WW (2022-11)"
    language: en
    pdf: sources/umc404hd_quickstart_WW.pdf
    source_url: https://www.behringer.com/en/products/0805-AAT
    source_note: "Downloaded in a browser by the owner on 2026-09-20 as QSG_BE_0805-AAT_U-PHORIA-Series_WW.pdf; the product page above is where Behringer lists it, not a direct file URL."
    retrieved: 2026-09-20
    page_spec:                    # English only. Skipped: safety/warranty (p2-3), multilingual hook-up diagram (p13), other languages, UMC22/UM2 specs (p33)
      - {page: 17}
      - {page: 26, clip: [0, 0, 440, 298]}
      - {page: 31}
      - {page: 32}
    split: headings
    # real headings only: "(EN) Step N: ..." bold lines and the Specifications heading (not the running page header)
    heading_pattern: '^((-\s+)?\*\*\(EN\)\s[^\n]*\*\*\s*$|#{1,2}\s+Specifications\s*$)'
    applies_to: "One Quick Start shared by the whole U-PHORIA family (UMC404HD, UMC204HD, UMC202HD, UMC22, UM2). Only UMC404HD-relevant content applies to the owner's unit; spec tables list several models side by side. Quick Start only, not a full manual."

