    source_note: "Downloaded in a browser by the owner on 2026-09-20 as MPK-mini-Quickstart-Guide-v1_3.pdf. The PDF says only 'MPK mini' and does not name the generation; it was matched to the MK3 by content (a display showing program and BPM, MPK mini Software Manager, note repeat; no speaker/headphones, so not the Play mk3)."
    retrieved: 2026-09-20
    page_spec:                    # page 1 only: English, Spanish and French share it; page 2 is other languages
      - {page: 1}
    stop_at: '^#\s+\**\s*Gu[ií]a de inicio r[aá]pido'      # English precedes the first Spanish heading
    split: headings
    heading_pattern: '^#{1,2}\s+(Quickstart Guide \(English\)|Box Contents|Support|Setup|Registration and Software Download|Setting up MPK mini with Your DAW|Features|Technical Specifications|Trademarks and Licenses)\s*$'
    coverage_skip: "multilingual sheet; the PDF text includes Spanish and French, so English-only recall cannot be computed against it"
    applies_to: "MPK mini MK3 (matched by content, not by the PDF's own label). Quick Start only, not a full manual. English only."

