# One entry per source PDF. tools/convert_manual.py reads this and writes docs/manuals/<id>/.
# PDFs themselves are NOT committed (copyright); only this manifest + converted markdown are.
# `pages` is the 1-based inclusive PDF page range to convert (excludes TOC/other languages/legal).
manuals:
  - id: elektron-analog-four-mkii-manual
    device: elektron-analog-four
    manufacturer: Elektron
    model: Analog Four MKII
    title: Analog Four MKII User Manual
    doc_type: user-manual
    doc_version: OS 1.55
    language: en
    pdf: sources/analog-four-mkii_OS1.55.pdf
    source_url: https://www.elektron.se/wp-content/uploads/2026/06/Analog-Four-MKII-User-Manual_ENG_OS1.55_260610.pdf
    retrieved: 2026-09-20
    pages: [10, 113]
    split: outline
    split_level: 2
    applies_to: "Analog Four MKII (owner confirmed MKII on 2026-09-20)."

  - id: akai-apc20-quick-start
    device: akai-apc20
    manufacturer: Akai Professional
    model: APC20
    title: APC20 Quickstart Guide (Rev A)
    doc_type: quick-start
    doc_version: Rev A
    language: en
    pdf: sources/apc20_quickstart_revA.pdf
    source_url: https://cdn.inmusicbrands.com/akai/attachments/legacy1/apc20___quickstart_guide___reva_00.pdf
    retrieved: 2026-09-20
    pages: [3, 5]                 # English only; the PDF repeats this in 5 other languages
    split: outline
    split_level: 2
    skip_titles: [ENGLISH]
    applies_to: "APC20. Quick Start only: the official full operator's manual was not found."

  - id: donner-b1-manual
    device: donner-b1
    manufacturer: Donner
    model: Essential B1
    title: Donner B1 Analog Bass Sequencer User Manual
    doc_type: user-manual
    doc_version: "V03 (2022-10-10)"
    language: en
    pdf: sources/donner-b1_manual_all-languages.pdf
    source_url: https://cdn.shopifycdn.net/s/files/1/1384/9629/files/ESSENTIAL_B1_USER_MANUAL_ALL_LANGUAGES.pdf?v=1686046123
    retrieved: 2026-09-20
    pages: [3, 20]                # English only; French starts p21. Regulatory pages 111-112 excluded.
    split: headings
    heading_pattern: '^(#{1,3}\s+|\*\*[A-Z][A-Z0-9 /&+.,-]{3,}\*\*\s*$)'
    skip_titles: [ENGLISH]
    applies_to: "Donner B1 (Essential B1), firmware era of manual V03."

  - id: behringer-rd-9-manual
    device: behringer-rd-9
    manufacturer: Behringer
    model: RD-9 Rhythm Designer
    title: RD-9 Rhythm Designer User Manual
    doc_type: user-manual
    doc_version: "V 1.0"
    language: en
    pdf: sources/rd-9_manual_EN_V1.0.pdf
    source_url: https://www.behringer.com/en/products/0704-AAB
    source_note: "Downloaded in a browser by the owner on 2026-09-20 as M_BE_P0DG6_RD-9_EN.pdf; the product page above is where Behringer lists it, not a direct file URL."
    retrieved: 2026-09-20
    pages: [5, 37]                # excludes cover/TOC, safety, legal and warranty (p2-4) and the blank last page
    split: outline
    split_level: 3
    applies_to: "Behringer RD-9 Rhythm Designer, manual V 1.0 (2022)."

  - id: behringer-umc404hd-quick-start
    device: behringer-umc404hd
    manufacturer: Behringer
    model: U-PHORIA UMC404HD
    title: U-PHORIA Quick Start Guide (UMC404HD family)
    doc_type: quick-start
    doc_version: "QSG WW (2022-11)"
    language: en
    pdf: sources/umc404hd_quickstart_WW.pdf
    source_url: https://www.behringer.com/en/products/0805-AAT
    source_note: "Downloaded in a browser by the owner on 2026-09-20 as QSG_BE_0805-AAT_U-PHORIA-Series_WW.pdf; the product page above is where Behringer lists it, not a direct file URL."
    retrieved: 2026-09-20
    page_spec:                    # English only. Skipped: safety/warranty (p2-3), multilingual hook-up diagram (p13), other languages, UMC22/UM2 specs (p33)
      - {page: 17}
      - {page: 26, clip: [0, 0, 440, 298]}
      - {page: 31}
      - {page: 32}
    split: headings
    # real headings only: "(EN) Step N: ..." bold lines and the Specifications heading (not the running page header)
    heading_pattern: '^((-\s+)?\*\*\(EN\)\s[^\n]*\*\*\s*$|#{1,2}\s+Specifications\s*$)'
    applies_to: "One Quick Start shared by the whole U-PHORIA family (UMC404HD, UMC204HD, UMC202HD, UMC22, UM2). Only UMC404HD-relevant content applies to the owner's unit; spec tables list several models side by side. Quick Start only, not a full manual."

  - id: akai-mpk-mini-mk3-quick-start
    device: akai-mpk-mini-mk3
    manufacturer: Akai Professional
    model: MPK mini MK3
    title: MPK mini Quickstart Guide (English, v1.3)
    doc_type: quick-start
    doc_version: "Quickstart v1.3 (2020-06)"
    language: en
    pdf: sources/mpk-mini-mk3_quickstart_v1.3.pdf
    source_url: https://www.akaipro.com/mpk-mini-mk3/
    source_note: "Downloaded in a browser by the owner on 2026-09-20 as MPK-mini-Quickstart-Guide-v1_3.pdf. The PDF says only 'MPK mini' and does not name the generation; it was matched to the MK3 by content (a display showing program and BPM, MPK mini Software Manager, note repeat; no speaker/headphones, so not the Play mk3)."
    retrieved: 2026-09-20
    page_spec:                    # page 1 only: English, Spanish and French share it; page 2 is other languages
      - {page: 1}
    stop_at: '^#\s+\**\s*Gu[ií]a de inicio r[aá]pido'      # English precedes the first Spanish heading
    split: headings
    heading_pattern: '^#{1,2}\s+(Quickstart Guide \(English\)|Box Contents|Support|Setup|Registration and Software Download|Setting up MPK mini with Your DAW|Features|Technical Specifications|Trademarks and Licenses)\s*$'
    coverage_skip: "multilingual sheet; the PDF text includes Spanish and French, so English-only recall cannot be computed against it"
    applies_to: "MPK mini MK3 (matched by content, not by the PDF's own label). Quick Start only, not a full manual. English only."

