# One entry per source PDF. tools/convert_manual.py reads this and writes docs/manuals/<id>/.
# PDFs themselves are NOT committed (copyright); only this manifest + converted markdown are.
# `pages` is the 1-based inclusive PDF page range to convert (excludes TOC/other languages/legal).
