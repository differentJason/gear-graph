# Human decisions layered on top of the fetched evidence (eurorack/evidence/*.json).
# `function` lines come from ModularGrid / retailer descriptions surfaced by web search: short and NOT verified against manuals.
# A field override (value + basis) is shown on the module page as "inferred" or "override" with its reasoning.
# `role: supply` marks a power supply: its rail numbers are CAPACITY, not draw.

behringer-cp1a:
  role: supply
  connections: 14
  function: "Eurorack power supply: +12V, -12V and +5V rails"
  notes: "ModularGrid: ships with two flying bus board ribbons, each with 7 power connections for modules (14 total). How your case distributes power is not recorded."
  hp: {value: 4, status: override, basis: "ModularGrid says '4 HP' and gives module dimensions '129 x 20 x 52 mm (4HP)'. The retailer's '84HP' is the row size the supply can power ('a complete 84HP row'), not the module's width."}

behringer-961-interface:
