behringer-space-fx:
  function: "Stereo multi-effects engine (reverbs, delays, modulation)"
  notes: "Sources disagree on power in the wild: ModularGrid lists 90 mA / 25 mA, while other listings quote 100 mA / 30 mA and 41 mm depth (ModularGrid says 30 mm). Only ModularGrid could be parsed."
