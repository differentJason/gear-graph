# Where each Eurorack module's specs are read from. tools/fetch_specs.py fetches every URL here and records the
# extracted numbers plus the raw lines they came from (eurorack/evidence/<id>.json).
#
# tier: official  = the manufacturer's own page
#       retailer  = a shop's spec listing (usually copies the maker's numbers)
#       community = ModularGrid (user-maintained database)
# A value is treated as CONFIRMED only when two independent sources agree. Anything else is flagged.
#
# Modules NOT listed here could not be identified confidently yet (see inventory.yaml questions).
