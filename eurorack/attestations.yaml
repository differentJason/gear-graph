# Owner attestations: statements by the owner that a class of values is correct, with scope and date.
# They are layered ON TOP of the evidence (like overrides.yaml). They never change a field's evidence status
# (confirmed / single / ...), which stays an honest count of how many sources agreed; they add a separate flag.
#
# fields:     which spec fields the statement covers
# applies_to: which values within those fields
# excludes:   what the statement does NOT cover, and why
- id: owner-sourced-draw
  by: owner
  date: 2026-09-20
  fields: [ma_p12, ma_m12, ma_p5]
  statuses: [confirmed, single]        # a value is attested only if its evidence status is one of these
  roles: [module]                      # module draw figures only, not supply capacity
  statement: "The owner sourced the module draw values from the manufacturers previously and considers them correct."
  excludes: "Values with status inferred (zero-draw assumptions for passive modules) were the assistant's inference, not sourced from a manufacturer. Supply capacity figures are not draw values."
