# Controlled vocabulary for `tags:` in section frontmatter.
# Tags listed under `heading_only` are too generic for body matching ("button" is in every manual)
# and are applied only when a keyword appears in the section heading.
# A tag is applied to a section when a keyword appears in its heading, or 2+ times in its body.
# tools/validate.py rejects any tag not listed here, so the vocabulary stays consistent.
tags:
  midi:            [midi, cc, nrpn, program change, channel, din sync]
  usb:             [usb, host, driver, class compliant]
  audio-io:        [audio input, audio output, main out, headphone, jack, 1/4", stereo, balanced, line in, line out, phones]
  power:           [power, psu, adapter, dc 9v, battery, mains, voltage]
  sync-clock:      [clock, sync, tempo, bpm, din sync, external sync, start/stop]
  sequencer:       [sequencer, step, pattern, sequence, track, trig, tie, swing, song mode, chain]
  sound-design:    [oscillator, filter, envelope, lfo, waveform, cutoff, resonance, attack, decay, sustain, release, saw, square, wave designer]
  effects:         [effect, delay, reverb, chorus, distortion, overdrive, saturation, compressor, eq]
  presets-patterns: [preset, save, load, project, kit, sound pool, bank, memory, recall]
  controls-overview: [panel, knob, button, key, pad, layout, front panel, rear panel, top panel, overview]
  cv-gate:         [cv, control voltage, expression pedal, eurorack]
  software-editor: [editor, software, app, plug-in, plugin, installation, install, mpk editor]
  daw-integration: [daw, ableton, bitwig, logic, reaper, mackie, hui, control surface, clip launch, session view]
  firmware:        [firmware, update, os version, upgrade, bootloader]
  specifications:  [specification, technical information, dimensions, weight, sample rate, bit depth, impedance, frequency response]
  troubleshooting: [troubleshoot, problem, not working, reset, factory, error, no sound]
  safety:          [warning, caution, safety, fcc, hazard, do not open, regulatory, disposal]
  setup:           [connecting, getting started, introduction, quick start, connection diagram, first time, installation]

heading_only: [controls-overview, setup, safety, specifications]
