# Source of truth for how the gear is WIRED. The graph's connection edges are derived from this file; edit here.
# Same discipline as inventory.yaml: nothing is recorded that the owner has not stated, and unknown stays unknown.
#
# The earlier (Feb 2025) routing notes predate the current setup and were not carried over. This file is filled in by
# asking the owner about one device at a time, so each entry has a status and a date.
#
# ids refer to `id:` values in inventory.yaml. Ports are free text copied from the device's panel (they are checked against
# the manuals later, see graph/README.md). A port the owner has not named is left out, never guessed.
#
# setup:     which physical arrangement a link belongs to (see `setups`). The same device can be wired differently per setup.
# medium:    audio | midi | usb | clock | cv | gate | power
# status:    confirmed   = the owner stated it
#            unconfirmed = proposed, waiting for an answer (never used in conclusions)
# swappable: true = the owner can swap other gear into this connection; the recorded device is one possible occupant
#
# links:            # one entry per physical cable or bus, directional (from -> to). Bidirectional buses (USB) use one entry
#                   # with `bidirectional: true`.
#   - {setup: <id>, from: <item-id>, from_port: "<port>", to: <item-id>, to_port: "<port>", medium: audio,
#      status: confirmed, confirmed: 2026-01-01, note: "optional"}
#
# cases:            # each Eurorack case: its rows (format + usable HP), the supply that feeds it, and anything mounted in it
#   - {setup: <id>, id: <case-item-id>, rows: [{format: 3U, hp: 84}], supply: <supply-item-id>, mounted: [<item-id>]}
# placements:       # where each Eurorack module physically sits and which supply feeds it. position = left to right (optional)
#   - {setup: <id>, module: <item-id>, case: <case-item-id>, powered_by: <supply-item-id>, row: <format>, position: 1, status: confirmed}
#                   # Only FIXED facts are recorded (case, supply, row). Patch cables between modules change every session and are not recorded.

schema_version: 1
updated: 2026-09-23

setups:
  - {id: main-studio, name: Main studio, interface: behringer-umc1820, status: confirmed, confirmed: 2026-09-20,
     note: "Recorded first. The alternate jam-location setup (UMC404HD) is a later pass."}

links:
  # --- computer ---
  - {setup: main-studio, from: behringer-umc1820, to: mac-mini-m4, medium: usb, bidirectional: true,
     status: confirmed, confirmed: 2026-09-20, note: "Normally connected to the Mac Mini M4 (Logic Pro). Ports not named."}

  # --- audio into the UMC1820: the owner's DEFAULT setup. Input 2 is open. Cables are TS or TRS as needed (owner). ---
  - {setup: main-studio, from: behringer-rd-9, from_port: "MONO", to: behringer-umc1820, to_port: "Input 1", medium: audio,
     status: confirmed, confirmed: 2026-09-20}
  - {setup: main-studio, from: elektron-analog-four, from_port: "MAIN OUT L/R", to: behringer-umc1820, to_port: "Input 3/4", medium: audio,
     status: confirmed, confirmed: 2026-09-20}
  - {setup: main-studio, from: intellijel-audio-stereo-line-out-jacks-1u, from_port: "L/R (balanced TRS)", to: behringer-umc1820, to_port: "Input 5/6", medium: audio,
     status: confirmed, confirmed: 2026-09-20, note: "The owner: all Eurorack signals end up in the Intellijel outs, which send L and R balanced TRS to the interface."}
  - {setup: main-studio, from: elektron-digitakt-mk1, from_port: "main out (L/R)", to: behringer-umc1820, to_port: "Input 7/8", medium: audio,
     status: confirmed, confirmed: 2026-09-20, note: "Port name is the owner's wording ('main out'); the Digitakt manual is not ingested to check it."}

  # --- inside the Eurorack ---
  - {setup: main-studio, from: intellijel-stereo-line-out-1u, to: intellijel-audio-stereo-line-out-jacks-1u, medium: audio,
     status: unconfirmed, note: "Pairing comes from the makers' listings (the two are sold as a pair); the owner has not described the cable between them."}

  # --- MIDI: RD-9 MIDI OUT -> MIDI Thru5 -> five outputs. Confirmed by the owner 2026-09-20 ("yes, exactly that"). Ports not named.
  #     The owner can change out any of the five outputs, and the K2 and B1 share one slot. ---
  # MIDI chain revised by the owner 2026-09-23: RD-9 -> Digitakt -> Thru5, Analog Four moved to the Digitakt's THRU,
  # freed Thru5 output feeds the UMC1820's MIDI IN (to Logic over the existing USB link). Replaces the 2026-09-20
  # RD-9 -> Thru5 fan-out, in which the Digitakt and Analog Four were on Thru5 outputs.
  - {setup: main-studio, from: behringer-rd-9, from_port: "MIDI OUT", to: elektron-digitakt-mk1, to_port: "MIDI IN", medium: midi,
     status: confirmed, confirmed: 2026-09-23}
  - {setup: main-studio, from: elektron-digitakt-mk1, from_port: "MIDI OUT/SYNC A", to: midi-thru5, medium: midi,
     status: confirmed, confirmed: 2026-09-23,
     note: "OUT, not THRU: the Thru5 gets the Digitakt's own clock/transport (following the RD-9) plus its MIDI tracks. The RD-9's ch 10 notes stop at the Digitakt."}
  - {setup: main-studio, from: elektron-digitakt-mk1, from_port: "MIDI THRU/SYNC B", to: elektron-analog-four, medium: midi,
     status: confirmed, confirmed: 2026-09-23,
     note: "THRU forwards the RD-9's stream unchanged (clock, transport, ch 10 notes), so the Analog Four is clocked by the RD-9 one hop earlier than the Thru5 synths."}
  - {setup: main-studio, from: midi-thru5, to: korg-m1, medium: midi, status: confirmed, confirmed: 2026-09-20, swappable: true}
  - {setup: main-studio, from: midi-thru5, to: dreadbox-typhon, medium: midi, status: confirmed, confirmed: 2026-09-20, swappable: true}
  - {setup: main-studio, from: midi-thru5, to: behringer-k2, medium: midi, status: confirmed, confirmed: 2026-09-20, swappable: true,
     note: "Shares one Thru5 output with the Donner B1: one or the other."}
  - {setup: main-studio, from: midi-thru5, to: donner-b1, medium: midi, status: confirmed, confirmed: 2026-09-20, swappable: true,
     note: "Shares one Thru5 output with the Behringer K2: one or the other."}
  - {setup: main-studio, from: midi-thru5, to: behringer-umc1820, to_port: "MIDI IN", medium: midi, status: confirmed, confirmed: 2026-09-23,
     note: "Owner 2026-09-23: reaches Logic Pro on the Mac Mini over the UMC1820's existing USB link. One Thru5 output is still free."}

  - {setup: main-studio, from: behringer-rd-9, from_port: "SYNC OUT", to: korg-sq-64, medium: clock, status: confirmed, confirmed: 2026-09-20}
  - {setup: main-studio, from: behringer-rd-9, from_port: "SYNC OUT", to: arturia-keystep, medium: clock, status: confirmed, confirmed: 2026-09-20}
  - {setup: main-studio, from: behringer-rd-9, from_port: "SYNC OUT", to: jakes-clock-and-musical-divider, medium: clock, status: confirmed, confirmed: 2026-09-20,
     note: "Its clock input; the module divides the clock for the rest of the rack. Jack not named."}

# Statements by the owner that are not yet tied to a specific cable. Kept so they are not lost, and so nothing is inferred:
# turning them into links needs both ends and the ports.
open_statements:
  - {setup: main-studio, confirmed: 2026-09-20, statement: "The RD-9 is the master clock."}
  - {setup: main-studio, confirmed: 2026-09-23, statement: "The Mac receives MIDI through the UMC1820 MIDI IN (fed by a Thru5 output, i.e. the Digitakt's MIDI OUT stream). Nothing sends MIDI from the Mac to the gear. Replaces the 2026-09-20 statement 'Nothing sends MIDI back to the Mac.'"}
  - {setup: main-studio, confirmed: 2026-09-20, statement: "Default UMC1820 inputs: 1 RD-9, 2 open, 3/4 Analog Four, 5/6 Eurorack, 7/8 Digitakt. Everything runs straight into the interface; main outs are used on everything, with TS or TRS cables as needed."}
  - {setup: main-studio, confirmed: 2026-09-20, statement: "Gear not in that default list (for example the Korg M1, Dreadbox Typhon, Behringer K2, Donner B1) is swapped in and out as needed. Where its audio goes when in use is not yet stated."}
  - {setup: main-studio, confirmed: 2026-09-20, statement: "The Analog Four's CV OUTPUTS A-D are sometimes used as CV tracks into the Eurorack. Which module inputs is not yet stated."}
  - {setup: main-studio, confirmed: 2026-09-20, statement: "CV / gate / trig sources into the Eurorack: Analog Four MKII, Korg SQ-64, Arturia KeyStep (original), and the Behringer K2 (any of its outs). Each goes into 'various module inputs'; which module inputs is not yet stated."}

